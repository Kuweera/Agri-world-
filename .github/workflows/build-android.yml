name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up templates, signing key and editor settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build/android
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # SIGNING KEY. Android only installs an update over an installed app when both APKs are
          # signed with the SAME key. The key therefore lives in GitHub secrets (see docs/SIGNING.md)
          # and is reused by every build. Without the secrets a throw-away key is made (the old
          # behaviour): the APK then cannot update an installed game and is named ...-TEMPKEY.
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > $HOME/agriworld.keystore
            echo "KS_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
            echo "APK_SUFFIX=" >> $GITHUB_ENV
            echo "Using the permanent signing key (alias $KS_ALIAS)"
          else
            echo "::warning::No signing secrets set: using a TEMPORARY key. This APK cannot update an installed AgriWorld; see docs/SIGNING.md"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore $HOME/agriworld.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
            echo "KS_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KS_PASS=android" >> $GITHUB_ENV
            echo "APK_SUFFIX=-TEMPKEY" >> $GITHUB_ENV
          fi
          keytool -list -keystore $HOME/agriworld.keystore -storepass "$(grep '^KS_PASS=' $GITHUB_ENV | cut -d= -f2-)" | tail -3 || true
          JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which keytool))))
          echo "Java home: $JAVA_HOME_DIR"
          # Debug exports use the same key, so debug and release APKs can replace each other.
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            "export/android/java_sdk_path = \"$JAVA_HOME_DIR\"" \
            "export/android/debug_keystore = \"$HOME/agriworld.keystore\"" \
            "export/android/debug_keystore_user = \"$KS_ALIAS\"" \
            "export/android/debug_keystore_pass = \"$(grep '^KS_PASS=' $GITHUB_ENV | cut -d= -f2-)\"" \
            > ~/.config/godot/editor_settings-4.tres

      - name: Allow compressed textures for Android
        run: |
          # The 3D models (.glb) carry textures. Android export needs ETC2/ASTC import enabled.
          if grep -q "import_etc2_astc" project.godot; then
            sed -i 's|textures/vram_compression/import_etc2_astc=.*|textures/vram_compression/import_etc2_astc=true|' project.godot
          elif grep -q '^\[rendering\]' project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi
          grep -n "etc2" project.godot

      - name: Import project
        run: godot --headless --import || true

      - name: Check that every preloaded file exists
        run: |
          missing=0
          for p in $(grep -rhoE 'preload\("res://[^"]+"\)' scripts | sed -E 's|preload\("res://(.*)"\)|\1|' | sort -u); do
            if [ ! -f "$p" ]; then
              echo "MISSING FILE: $p"
              missing=1
            fi
          done
          if [ $missing -eq 0 ]; then echo "All preloaded files exist"; fi
          ls scripts
          exit $missing

      - name: Syntax check scripts
        run: |
          fail=0
          for f in farm_main farm_grid camera_rig hud game_state crop_data crop_stages environment_setup save_manager vehicle_data implement_data implement_models suspension machine_models shop_catalog machinery_shop vehicle_model tractor_view drive_controls farm_layout autopilot settings crop_models mesh_builder tile_models farm_scenery; do
            echo "== $f"
            godot --headless --check-only --script res://scripts/$f.gd || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Run logic tests
        run: |
          ls -la scripts scripts/tests || true
          # A script error in the tests can leave Godot waiting forever, so give it a time limit.
          code=0
          timeout 240 godot --headless --script res://scripts/tests/test_game_state.gd || code=$?
          if [ $code -eq 124 ]; then
            echo "TESTS HUNG: no result after 240 seconds - a script error stopped the test run. Look above for SCRIPT ERROR."
          fi
          exit $code

      - name: Vehicle physics report (information only)
        run: timeout 120 godot --headless --script res://scripts/tests/physics_report.gd || true

      - name: Export game APK
        if: always()
        run: |
          # One APK per phone type, each much smaller than a combined one:
          #   armeabi-v7a = 32-bit phones (budget phones like the TECNO Pop 7 need this one)
          #   arm64-v8a   = 64-bit phones
          # Each is a release build, with the debug build as a fallback if release fails.
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/agriworld.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
          # Android refuses an update whose version code is not higher, so it rises with every build:
          # code = run number x 10 + 1 (32-bit) or 2 (64-bit). Name 0.1.<run number>.
          sed -i "s|^version/name=.*|version/name=\"0.1.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          grep -n "version/" export_presets.cfg
          sed -i "s|^run/main_scene=.*|run/main_scene=\"res://scenes/main.tscn\"|" project.godot
          grep main_scene project.godot
          for abi in armeabi-v7a arm64-v8a; do
            if [ "$abi" = "armeabi-v7a" ]; then vc=$((GITHUB_RUN_NUMBER * 10 + 1)); else vc=$((GITHUB_RUN_NUMBER * 10 + 2)); fi
            sed -i "s|^version/code=.*|version/code=$vc|" export_presets.cfg
            sed -i 's|^architectures/armeabi-v7a=.*|architectures/armeabi-v7a=false|' export_presets.cfg || true
            sed -i 's|^architectures/arm64-v8a=.*|architectures/arm64-v8a=false|' export_presets.cfg || true
            sed -i "s|^architectures/$abi=.*|architectures/$abi=true|" export_presets.cfg || true
            grep -n "architectures" export_presets.cfg || true
            if godot --headless --verbose --export-release "Android" build/android/agriworld-main-$abi${APK_SUFFIX}.apk; then
              echo "EXPORT $abi: release build"
            else
              echo "EXPORT $abi: release failed, using debug build"
              godot --headless --verbose --export-debug "Android" build/android/agriworld-main-$abi${APK_SUFFIX}.apk
            fi
          done

      - name: APK size and signing report
        if: always()
        run: |
          ls -l build/android/*.apk || true
          # The signing certificate fingerprint must be IDENTICAL in every build, or Android will
          # refuse to install it over the previous one.
          for a in build/android/*.apk; do
            echo "== $a"
            keytool -printcert -jarfile "$a" 2>&1 | grep -i "SHA256\|Owner" || echo "(could not read signature)"
            AS=$(find /usr/lib/android-sdk -name apksigner 2>/dev/null | head -1)
            if [ -n "$AS" ]; then "$AS" verify --print-certs -v "$a" 2>&1 | grep -i "verifies\|SHA-256\|Number of signers" || true; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriworld-debug-apks
          path: build/android/*.apk
